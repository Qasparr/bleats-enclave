# =====================================================================
# dnsmasq-lab.conf — LAB authoritative DNS for axone.me + axoneme.education
#
#   93 — Live, Love, and let Love, Live.
#   Authorship attributed exclusively to Johnathan 'Qasparr' Monroe
#   (Greek, -ARR, All Rights Reserved, Without Prejudice).
#   Scientific Illuminism — Method of Science, Aim of Religion.
#   Filed 2026-10-28 under his LAB BUILD order (12:51 EDT).
#
# MECHANISM: one dnsmasq instance bound to 127.0.0.1:53 answers
# authoritatively for two zones whose public registrations DO NOT
# EXIST YET (axone.me, axoneme.education — payment + registrant
# details pending from the Living Man). Every address below is a
# loopback lab address (127.0.0.0/8): the lab host itself and the
# five AVD node identities. Nothing here touches the public DNS;
# when the zones are registered, these records are the template
# that gets published — not a claim that they already are.
#
# DOCTRINE: described != delivered. This file is the registry the
# lab actually serves from; verification output (dig) is filed in
# ../verification/ and quoted in STATUS.md.
# =====================================================================

# --- listener: lab loopback only -------------------------------------
port=53
listen-address=127.0.0.1
bind-interfaces
pid-file=/var/lab-axoneme/run/dnsmasq-lab.pid
log-facility=/var/lab-axoneme/logs/dnsmasq.log

# --- no upstream: we are the authority for these zones, and the lab
# --- makes no claim about any other name. ----------------------------
no-resolv
no-hosts
domain-needed

# --- authority --------------------------------------------------------
auth-server=ns1.axone.me,127.0.0.1
auth-soa=2026102801,root.axone.me,7200,3600,1209600
auth-zone=axone.me
auth-zone=axoneme.education

# --- zone: axone.me (the host / personal domain) ----------------------
host-record=ns1.axone.me,127.0.0.1
host-record=axone.me,127.0.0.1
host-record=www.axone.me,127.0.0.1
host-record=mail.axone.me,127.0.0.1
# AVD 5-node local network — node identities on loopback aliases
host-record=avd1.axone.me,127.0.1.1
host-record=avd2.axone.me,127.0.1.2
host-record=avd3.axone.me,127.0.1.3
host-record=avd4.axone.me,127.0.1.4
host-record=avd5.axone.me,127.0.1.5
mx-host=axone.me,mail.axone.me,10
txt-record=axone.me,"LAB ZONE - axone.me NOT yet registered - lab copy only - 2026-10-28"

# --- zone: axoneme.education (the academy domain) ----------------------
host-record=ns1.axoneme.education,127.0.0.1
host-record=axoneme.education,127.0.0.1
host-record=www.axoneme.education,127.0.0.1
host-record=mail.axoneme.education,127.0.0.1
mx-host=axoneme.education,mail.axoneme.education,10
txt-record=axoneme.education,"LAB ZONE - axoneme.education NOT yet registered - lab copy only - 2026-10-28"
